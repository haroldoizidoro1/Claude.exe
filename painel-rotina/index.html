<title>Painel de Rotina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: floating glass rail on the left, a sticky top bar with a "dynamic island" for focus and toasts,
   and glass cards over a soft wallpaper. Dark-first, with a light theme mirrored from the same tokens. */
:root {
  color-scheme: dark;
  --bg: #0d0f13;
  --fg: #eef0f4;
  --fg-2: #a3a9b5;
  --fg-3: #6c7380;
  --line: rgba(255,255,255,.08);
  --line-2: rgba(255,255,255,.14);
  --glass: rgba(28,31,38,.62);
  --glass-hi: rgba(255,255,255,.06);
  --solid: #171a20;
  --solid-2: #1f232b;
  --track: rgba(255,255,255,.08);
  --island: #050607;
  --island-fg: #f3f4f6;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -18px rgba(0,0,0,.7);
  --wl: 42%;
  --wa: .55;

  --c-blue: #4c8dff;
  --c-violet: #9b7bff;
  --c-pink: #ff4f8b;
  --c-red: #ff5a5f;
  --c-orange: #ff8a3d;
  --c-amber: #f5b83d;
  --c-green: #33c37a;
  --c-teal: #2ec5c9;
  --c-gray: #8b93a1;

  --accent: var(--c-blue);
  --on-accent: #ffffff;

  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;

  --h1: 220; --h2: 230; --s: 12%;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f4;
    --fg: #15181e;
    --fg-2: #555c69;
    --fg-3: #8a909b;
    --line: rgba(20,24,32,.08);
    --line-2: rgba(20,24,32,.14);
    --glass: rgba(255,255,255,.66);
    --glass-hi: rgba(255,255,255,.7);
    --solid: #ffffff;
    --solid-2: #f4f5f8;
    --track: rgba(20,24,32,.08);
    --island: #0b0c0f;
    --island-fg: #f3f4f6;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -22px rgba(30,40,60,.35);
    --wl: 72%;
    --wa: .7;
    --c-blue: #2f6fe8;
    --c-violet: #7c5ce6;
    --c-pink: #e0336f;
    --c-red: #e03b40;
    --c-orange: #e26a1b;
    --c-amber: #c98a0c;
    --c-green: #1d9a5c;
    --c-teal: #13989c;
    --c-gray: #6c7482;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f4;
  --fg: #15181e;
  --fg-2: #555c69;
  --fg-3: #8a909b;
  --line: rgba(20,24,32,.08);
  --line-2: rgba(20,24,32,.14);
  --glass: rgba(255,255,255,.66);
  --glass-hi: rgba(255,255,255,.7);
  --solid: #ffffff;
  --solid-2: #f4f5f8;
  --track: rgba(20,24,32,.08);
  --island: #0b0c0f;
  --island-fg: #f3f4f6;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -22px rgba(30,40,60,.35);
  --wl: 72%;
  --wa: .7;
  --c-blue: #2f6fe8;
  --c-violet: #7c5ce6;
  --c-pink: #e0336f;
  --c-red: #e03b40;
  --c-orange: #e26a1b;
  --c-amber: #c98a0c;
  --c-green: #1d9a5c;
  --c-teal: #13989c;
  --c-gray: #6c7482;
}

html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--fg);
  background:
    radial-gradient(55% 45% at 12% -5%, hsl(var(--h1) var(--s) var(--wl) / var(--wa)), transparent 70%),
    radial-gradient(45% 45% at 105% 105%, hsl(var(--h2) var(--s) var(--wl) / var(--wa)), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
body.tinted .glass { background: color-mix(in oklab, var(--accent) 9%, var(--glass)); }
body.solid .glass { background: var(--solid); -webkit-backdrop-filter: none; backdrop-filter: none; }

/* ---------- shell ---------- */
.rail {
  position: fixed; z-index: 20;
  left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 60px; border-radius: 30px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0;
}
.brand { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); margin-bottom: 10px; }
.nav-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--fg-2); position: relative; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--glass-hi); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--line-2); color: var(--fg); }
.nav-btn .tip { position: absolute; left: 54px; white-space: nowrap; background: var(--island); color: var(--island-fg); padding: 5px 9px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transform: translateX(-4px); transition: .15s; }
.nav-btn:hover .tip, .nav-btn:focus-visible .tip { opacity: 1; transform: none; }
.rail .spacer { flex: 1; }
.sync { width: 10px; height: 10px; border-radius: 50%; background: var(--c-gray); margin-bottom: 8px; }
.sync[data-s="db"] { background: var(--c-green); }
.sync[data-s="local"] { background: var(--c-amber); }
.sync[data-s="none"] { background: var(--c-red); }

.main {
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 84px);
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  max-width: 1480px;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-block: 16px 12px;
}
.actions { justify-self: end; display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--fg-2); position: relative; }
.icon-btn:hover { background: var(--glass-hi); color: var(--fg); }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-pink); }

/* dynamic island */
.island {
  justify-self: center; grid-column: 2;
  min-width: 120px; height: 38px; border-radius: 999px;
  background: var(--island); color: var(--island-fg);
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.6);
  transition: min-width .35s cubic-bezier(.3,1.4,.5,1), height .35s cubic-bezier(.3,1.4,.5,1), padding .3s;
  max-width: min(520px, calc(100vw - 32px));
}
.island.wide { min-width: 300px; height: 44px; padding: 0 8px 0 10px; }
.island .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); box-shadow: 0 0 0 0 rgba(51,195,122,.6); animation: pulse 1.8s infinite; }
.island .pulse.brk { background: var(--c-teal); }
.island .pulse.pz { background: var(--c-amber); animation: none; }
.island .badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--c-green); color: #fff; flex: none; }
.island .badge.info { background: var(--accent); }
.island .badge.warn { background: var(--c-red); }
.island .msg { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.island .act { background: rgba(255,255,255,.12); color: var(--island-fg); padding: 6px 12px; border-radius: 999px; font-size: 12px; }
.island .act:hover { background: rgba(255,255,255,.2); }
.island .clock { color: #9aa1ad; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(51,195,122,0); } 100% { box-shadow: 0 0 0 0 rgba(51,195,122,0); } }

/* ---------- common ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 20px; }
.page-head h1 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 600; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.page-head p { margin: 6px 0 0; color: var(--fg-2); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; font-weight: 500; border: 1px solid var(--line-2); background: var(--glass-hi); transition: background .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--line-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); box-shadow: 0 8px 20px -10px var(--accent); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, #fff); }
.btn.danger { color: var(--c-red); }
.btn.danger.solid { background: var(--c-red); color: #fff; border-color: transparent; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn .i { width: 16px; height: 16px; }

.card { border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.card-h .sub { color: var(--fg-3); font-size: 12.5px; margin-top: 2px; }
.link { color: var(--accent); font-weight: 500; font-size: 13px; }
.link:hover { text-decoration: underline; }

.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.stat { border-radius: var(--r-md); padding: 10px 16px 12px; min-width: 112px; }
.stat .l { font-size: 12px; color: var(--fg-2); }
.stat .v { font-size: 24px; font-weight: 500; margin-top: 2px; }
.stat .v small { font-size: 13px; color: var(--fg-3); margin-left: 2px; }
.stat.alert .v { color: var(--c-red); }

.empty { border: 1px dashed var(--line-2); border-radius: var(--r-md); padding: 18px; color: var(--fg-2); display: grid; gap: 10px; justify-items: start; font-size: 13.5px; line-height: 1.5; }
.empty strong { color: var(--fg); font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  --cc: var(--c-gray);
  background: color-mix(in oklab, var(--cc) 16%, transparent);
  color: color-mix(in oklab, var(--cc) 78%, var(--fg)); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: var(--cc); flex: none; }
.prio { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; height: 22px; padding: 0 8px; border-radius: 6px; --cc: var(--c-gray);
  background: color-mix(in oklab, var(--cc) 14%, transparent); color: color-mix(in oklab, var(--cc) 85%, var(--fg)); }
.prio .i { width: 12px; height: 12px; }
.prio.urgent { --cc: var(--c-red); }
.prio.high { --cc: var(--c-orange); }
.prio.low { --cc: var(--c-gray); }

.check { width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--fg-3); display: grid; place-items: center; flex: none; color: transparent; transition: .15s; }
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check .i { width: 13px; height: 13px; stroke-width: 2.6; }

/* ---------- home ---------- */
.home-grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0,1fr)); }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.today-card .body { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.rings { width: 132px; height: 132px; flex: none; }
.legend { display: grid; gap: 12px; }
.legend .row { display: grid; grid-template-columns: 3px auto; column-gap: 10px; }
.legend .bar { border-radius: 2px; grid-row: span 2; }
.legend .k { font-size: 12px; color: var(--fg-2); }
.legend .v { font-size: 20px; font-weight: 500; }
.legend .v small { font-size: 12px; color: var(--fg-3); }

.next-ev { border-radius: var(--r-md); padding: 14px 16px; background: color-mix(in oklab, var(--accent) 22%, var(--solid-2)); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
.next-ev .when { font-size: 12px; color: color-mix(in oklab, var(--accent) 60%, var(--fg)); font-weight: 500; }
.next-ev .t { font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin: 2px 0; overflow-wrap: anywhere; }
.next-ev .time { font-size: 12.5px; color: var(--fg-2); }
.ev-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.ev-list li { display: grid; grid-template-columns: 3px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; cursor: pointer; }
.ev-list li .b { height: 22px; border-radius: 2px; background: var(--cc, var(--accent)); }
.ev-list li .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-list li .h { color: var(--fg-3); font-size: 12px; }

.tasklist { list-style: none; margin: 0; padding: 0; display: grid; }
.tasklist li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
.tasklist li:first-child { border-top: 0; }
.tasklist .t { font-weight: 500; cursor: pointer; overflow-wrap: anywhere; }
.tasklist .t:hover { color: var(--accent); }
.tasklist .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); }
.tasklist li.done .t { text-decoration: line-through; color: var(--fg-3); }
.late { color: var(--c-red) !important; }

.focus-card .clockface { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.dial { width: 120px; height: 120px; position: relative; flex: none; }
.dial svg { width: 100%; height: 100%; }
.dial .tm { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.dial .tm b { font-size: 24px; font-weight: 500; display: block; }
.dial .tm span { font-size: 11px; color: var(--fg-3); }
.focus-ctl { display: grid; gap: 10px; }
.focus-ctl .row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--track); gap: 2px; flex-wrap: wrap; }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--solid); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.bars { display: grid; grid-template-columns: repeat(var(--n,7), minmax(0,1fr)); gap: 8px; align-items: end; height: 140px; padding-top: 8px; }
.bars .col { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 6px; justify-items: center; }
.bars .val { font-size: 11px; color: var(--fg-3); }
.bars .track { width: 100%; max-width: 34px; background: var(--track); border-radius: 8px; position: relative; overflow: hidden; align-self: stretch; }
.bars .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; background: var(--accent); min-height: 0; transition: height .4s; }
.bars .col.now .fill { background: color-mix(in oklab, var(--accent) 100%, #fff 10%); }
.bars .lab { font-size: 11.5px; color: var(--fg-3); }
.bars .col.now .lab { color: var(--fg); font-weight: 600; }

/* ---------- tasks ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px; border-radius: 999px; margin-bottom: 16px; }
.toolbar select, .toolbar .search { height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-hi); padding: 0 12px; }
.toolbar select { padding-right: 28px; }
.toolbar .search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; color: var(--fg-3); }
.toolbar .search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; color: var(--fg); height: 100%; }
.board-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px 8px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 14px; min-width: 1080px; }
.col-b { border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 240px; transition: outline-color .15s; outline: 2px dashed transparent; outline-offset: -4px; }
.col-b.over { outline-color: var(--accent); }
.col-b .h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; }
.col-b .h .d { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.col-b .h b { font-weight: 600; }
.col-b .h .n { color: var(--fg-3); font-size: 12px; background: var(--track); border-radius: 999px; padding: 1px 8px; }
.col-b .h .icon-btn { margin-left: auto; width: 28px; height: 28px; }
.col-b .drop-hint { color: var(--fg-3); font-size: 12.5px; text-align: center; padding: 22px 8px; border: 1px dashed var(--line-2); border-radius: var(--r-md); }
.tcard { background: var(--solid); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; cursor: grab; transition: transform .12s, box-shadow .12s, border-color .12s; }
body.solid .tcard, .tcard { box-shadow: 0 6px 16px -12px rgba(0,0,0,.6); }
.tcard:hover { border-color: var(--line-2); transform: translateY(-1px); }
.tcard.dragging { opacity: .45; }
.tcard .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tcard .title { font-weight: 500; line-height: 1.35; display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
.tcard .title .check { width: 18px; height: 18px; margin-top: 1px; }
.tcard .title .check .i { width: 11px; height: 11px; }
.tcard.is-done .title span { color: var(--fg-2); }
.prog { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; color: var(--fg-3); }
.prog .t { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
.prog .t i { display: block; height: 100%; background: var(--cc, var(--accent)); border-radius: 4px; }
.tcard .foot { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--fg-3); }
.tcard .foot span { display: inline-flex; gap: 4px; align-items: center; }
.tcard .foot .i { width: 13px; height: 13px; }

.lst { display: grid; gap: 14px; }
.lst .grp h3 { font-size: 13px; color: var(--fg-2); font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.lst .grp h3 .d { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }
.lrow { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto auto; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.lrow:first-of-type { border-top: 0; }
.lrow .t { font-weight: 500; cursor: pointer; overflow-wrap: anywhere; }
.lrow .due { font-size: 12.5px; color: var(--fg-3); min-width: 64px; text-align: right; }
.lrow.done .t { color: var(--fg-3); text-decoration: line-through; }

/* ---------- agenda ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
.day { border-radius: var(--r-lg); padding: 12px; min-height: 260px; display: flex; flex-direction: column; gap: 8px; }
.day .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.day .dh .wd { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--fg-3); font-weight: 600; }
.day .dh .dn { font-size: 20px; font-weight: 500; }
.day.today .dh .dn { color: var(--accent); }

const LS_KEY = 'painel-rotina.v1';
const Store = {
  mode: 'wait', db: null, base: null, settingsRef: null, queues: new Map(), settingsTimer: 0,

  async init() {
    let db = null, user = null;
    try {
      if (window.claude?.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    } catch (e) { db = null; }
    let id = null;
    try { id = user ? await user.id() : null; } catch (e) { id = null; }
    if (db && id) {
      this.mode = 'db'; this.db = db;
      this.base = db.doc(`data/users/${id}/workspace`);
      this.settingsRef = db.doc(`data/users/${id}/settings`);
      let pending = COLS.length + 1;
      const first = () => { if (--pending === 0) { ui.ready = true; render(); } };
      COLS.forEach(col => {
        let got = false;
        this.base.collection(col).limit(1000).onSnapshot(snap => {
          const next = {};
          snap.docs.forEach(d => { next[d.id] = { ...d.data(), id: d.id }; });
          S[col] = next;
          if (!got) { got = true; first(); } else scheduleRender();
        }, err => this.fail(err));
      });
      let gotS = false;
      this.settingsRef.onSnapshot(snap => {
        if (!this.settingsTimer) { S.settings = { ...DEFAULTS, ...(snap.exists ? snap.data() : {}) }; applyLook(); gcalSync(); }
        if (!gotS) { gotS = true; first(); } else scheduleRender();
      }, err => this.fail(err));
    } else {
      this.loadLocal();
      ui.ready = true;
      applyLook(); render();
    }
    setSync();
    gcalBoot();
  },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      this.mode = 'local';
      if (raw) {
        const d = JSON.parse(raw);
        COLS.forEach(c => { S[c] = d[c] || {}; });
        S.settings = { ...DEFAULTS, ...(d.settings || {}) };
      }
    } catch (e) { this.mode = 'none'; }
  },
  saveLocal() {
    clearTimeout(this._lt);
    this._lt = setTimeout(() => {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ tasks:S.tasks, projects:S.projects, events:S.events, focus:S.focus, settings:S.settings })); }
      catch (e) { this.mode = 'none'; setSync(); }
    }, 250);
  },
  enqueue(key, fn) {
    const p = (this.queues.get(key) || Promise.resolve()).then(fn).catch(e => this.fail(e));
    this.queues.set(key, p);
    return p;
  },
  fail(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') toast('O espaço do painel acabou. Apague tarefas antigas ou exporte um backup e limpe os dados.', { kind:'warn', ms:7000 });
    else toast('Não foi possível salvar agora. Confira sua conexão; suas alterações seguem na tela.', { kind:'warn', ms:6000 });
  },
  put(col, obj) {
    S[col][obj.id] = obj;
    if (this.mode === 'db') { const { id, ...body } = obj; return this.enqueue(`${col}/${id}`, () => this.base.collection(col).doc(id).set(body)); }
    this.saveLocal();
    return Promise.resolve();
  },
  del(col, id) {
    delete S[col][id];
    if (this.mode === 'db') return this.enqueue(`${col}/${id}`, () => this.base.collection(col).doc(id).delete());
    this.saveLocal();
    return Promise.resolve();
  },
  saveSettings() {
    if (this.mode === 'db') {
      clearTimeout(this.settingsTimer);
      this.settingsTimer = setTimeout(() => {
        this.settingsTimer = 0;
        const body = { ...S.settings };
        this.enqueue('settings', () => this.settingsRef.set(body));
      }, 500);
    } else this.saveLocal();
  },
};
function setSync() {
  const el = $('#sync');
  el.dataset.s = Store.mode;
  el.title = { db:'Salvo na sua conta Claude', local:'Salvo só neste navegador', none:'Sem armazenamento: os dados somem ao fechar', wait:'Conectando…' }[Store.mode];

const AUTHZ = ['needs_reauth','server_not_connected','selection_required','server_not_found','blocked_by_policy','approval_required','not_in_manifest','not_granted','capability_disabled','capability_removed','consent_required'];

const gErrState = code => ({ needs_reauth:'reauth', server_not_connected:'notconn', server_not_found:'notconn', selection_required:'select', blocked_by_policy:'blocked', approval_required:'denied', not_in_manifest:'denied', consent_required:'denied', not_granted:'unavailable', capability_disabled:'unavailable', capability_removed:'unavailable' }[code] || 'down');

async function gcalBoot() {
  try { G.mcp = window.claude?.use ? await window.claude.use('mcp') : null; } catch (e) { G.mcp = null; }
  G.booted = true;

}
function gcalWindows() {
  const ws = weekStart(), out = [ws, addDays(ws, 7)];
  if (ui.weekOffset < 0 || ui.weekOffset > 1) out.push(addDays(ws, ui.weekOffset * 7));
  return out;
}
function gcalSync() {
  if (!G.booted) return;
  const want = new Map();
  if (gOn()) {
    if (G.state === 'off' || G.state === 'unavailable') G.state = 'wait';
    for (const cal of S.settings.gcalCals || []) for (const w of gcalWindows()) want.set(`${cal}|${ymd(w)}`, { cal, w });
  } else if (G.mcp) { G.state = 'off'; G.note = ''; }
  for (const [k, un] of G.subs) if (!want.has(k)) { un(); G.subs.delete(k); delete G.data[k]; }
  for (const [k, { cal, w }] of want) {
    if (G.subs.has(k)) continue;
    const input = { startTime: `${ymd(w)}T00:00:00`, endTime: `${ymd(addDays(w, 7))}T00:00:00`, orderBy: 'startTime', pageSize: 250 };
    if (cal !== 'primary') input.calendarId = cal;

    if (!e || e.status === 'cancelled' || e.eventType === 'WORKING_LOCATION') continue;
    if ((e.attendees || []).some(a => a.self && a.responseStatus === 'declined')) continue;
    const base = { g: true, cal, title: e.summary || '(sem título)',
      kind: e.eventType === 'FOCUS_TIME' ? 'focus' : e.eventType === 'OUT_OF_OFFICE' ? 'personal' : 'meeting',
      link: safeUrl(e.htmlLink), meet: safeUrl(e.conferenceUrl || e.conferenceData?.videoEntryPoint?.uri), location: e.location || '' };
    if (e.start && e.start.dateTime) {
      const s = new Date(e.start.dateTime), en = new Date(e.end?.dateTime || e.start.dateTime);

        end: ymd(en) === date ? `${pad(en.getHours())}:${pad(en.getMinutes())}` : '23:59' });

function allEvents() {

}
const findEvent = id => S.events[id] || allEvents().find(e => e.id === id);
const calName = id => { const c = (G.cals || []).find(x => x.id === id); return c ? (c.summary || c.id) : id === 'primary' ? 'Agenda principal' : id; };

  if ((!cur.length || (cur.length === 1 && cur[0] === 'primary')) && cals[0]) { S.settings = { ...S.settings, gcalCals: [cals[0].id] }; Store.saveSettings(); }
}
async function gcalConnect() {

  if (G.busy) return;
  G.busy = true; render();
  try {
    const r = await G.mcp.callTool(GC, 'list_calendars', { pageSize: 100 }, { cache: false });

    el.innerHTML = `<span class="pulse ${T.state === 'paused' ? 'pz' : T.mode === 'break' ? 'brk' : ''}"></span><span>${T.mode === 'break' ? 'Pausa' : 'Foco'}${T.state === 'paused' ? ' pausado' : ''}</span><span class="num" id="islandTime">${fmtMMSS(left)}</span>`;
    return;
  }
  const now = new Date();
  el.className = 'island';
  el.innerHTML = `<span class="clock">${esc(fmtWeekday(now))}</span><span class="num">${pad(now.getHours())}:${pad(now.getMinutes())}</span>`;

/* ================= focus timer ================= */
const TKEY = 'painel-rotina.timer';
let T = { mode:'focus', state:'idle', endAt:0, left:0, total:0 };
try { const t = JSON.parse(localStorage.getItem(TKEY) || 'null'); if (t && t.state) T = t; } catch (e) {}
const saveTimer = () => { try { localStorage.setItem(TKEY, JSON.stringify(T)); } catch (e) {} };
const timerTotal = mode => (mode === 'break' ? S.settings.breakMin : S.settings.focusMin) * 60;
const timerLeft = () => T.state === 'running' ? Math.max(0, (T.endAt - Date.now())/1000) : T.state === 'paused' ? T.left : timerTotal(T.mode);
function focusStart() {
  T.total = timerTotal(T.mode); T.endAt = Date.now() + T.total*1000; T.state = 'running'; saveTimer();
  toast(T.mode === 'focus' ? `Foco iniciado: ${S.settings.focusMin} min. Avisos em espera.` : `Pausa de ${S.settings.breakMin} min. Respire.`, { kind:'info' });
  render();
}
function focusPause() { T.left = timerLeft(); T.state = 'paused'; saveTimer(); render(); renderIsland(); }
function focusResume() { T.endAt = Date.now() + T.left*1000; T.state = 'running'; saveTimer(); render(); renderIsland(); }
function focusEnd() {
  if (T.mode === 'focus') { const done = Math.floor((T.total - timerLeft())/60); if (done >= 1) { logFocus(done); toast(`Sessão encerrada: ${done} min de foco registrados.`); } }
  T = { mode:T.mode, state:'idle', endAt:0, left:0, total:0 }; saveTimer(); render(); renderIsland();
}
function logFocus(min) {
  const d = today(), cur = S.focus[d];
  Store.put('focus', { id: d, date: d, minutes: (cur ? cur.minutes : 0) + min });
}
function beep() {
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((t, i) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = [880, 988, 1175][i]; g.gain.setValueAtTime(.0001, A.currentTime+t); g.gain.exponentialRampToValueAtTime(.18, A.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime+t+.16); o.connect(g).connect(A.destination); o.start(A.currentTime+t); o.stop(A.currentTime+t+.18); });
  } catch (e) {}
}
setInterval(() => {
  if (T.state === 'running') {
    const left = timerLeft();
    if (left <= 0) {
      if (T.mode === 'focus') { logFocus(Math.round(T.total/60)); T = { mode:'break', state:'idle', endAt:0, left:0, total:0 }; toast('Sessão de foco concluída. Hora da pausa.', { ms:6000 }); }
      else { T = { mode:'focus', state:'idle', endAt:0, left:0, total:0 }; toast('Pausa encerrada. Pronto para o próximo bloco?', { kind:'info', ms:6000 }); }
      saveTimer(); beep(); render(); renderIsland(); return;
    }
    const a = $('#islandTime'); if (a) a.textContent = fmtMMSS(left);
    const b = $('#dialTime'); if (b) b.textContent = fmtMMSS(left);
    const c = $('#dialArc'); if (c) c.setAttribute('stroke-dasharray', dialDash(left));
  } else if (T.state === 'idle' && !toastState) {
    const now = new Date(); if (now.getSeconds() === 0) renderIsland();
  }
}, 500);
const DIAL_C = 2 * Math.PI * 52;
const dialDash = left => { const tot = T.total || timerTotal(T.mode); const p = T.state === 'idle' ? 0 : 1 - left/tot; return `${DIAL_C*Math.max(0,Math.min(1,p))} ${DIAL_C}`; };

/* ================= derived ================= */
function stats() {
  const t = today(), ws = weekStart(), tasks = list('tasks');
  const open = tasks.filter(x => x.status !== 'done');
  return {
    open: open.length,
    dueWeek: open.filter(x => sameWeek(x.due, ws)).length,
    late: open.filter(x => x.due && x.due < t).length,
    doneWeek: tasks.filter(x => x.status === 'done' && x.doneAt && sameWeek(ymd(new Date(x.doneAt)), ws)).length,
    doneToday: tasks.filter(x => x.status === 'done' && x.doneAt && ymd(new Date(x.doneAt)) === t).length,
  };
}
const focusOn = d => (S.focus[d] ? S.focus[d].minutes : 0);

  const total = evs.filter(e => !e.allDay && days.some(d => ymd(d) === e.date)).length;
  const gErr = gIsErr(G.state) && S.settings.gcalOn;
  const gLine = !G.mcp ? '' : !S.settings.gcalOn ? '' : gErr ? ' · Google Agenda com problema' : G.state === 'ok' ? ` · Google Agenda atualizado às ${hhmm(G.updatedAt)}` : ' · carregando Google Agenda…';
  return `
  <div class="page-head">
    <div><h1>Agenda</h1><p>Semana de ${esc(label)} · ${plural(total, 'compromisso', 'compromissos')}${esc(gLine)}</p></div>
    <div class="head-actions">
      ${G.mcp && !S.settings.gcalOn ? `<button class="btn" data-act="gcal-connect">${ic('cal')}Conectar Google Agenda</button>` : gErr ? `<button class="btn" data-act="nav" data-view="ajustes">${ic('cal')}Ver problema do Google</button>` : ''}

      <button class="btn primary" data-act="new-event" data-date="${t}">${ic('plus')}Novo compromisso</button>
    </div>
  </div>
  <div class="week">${days.map(d => {
    const k = ymd(d), de = evs.filter(e => e.date === k).sort((a,b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0) || (a.start||'').localeCompare(b.start||''));
    const dt = tasks.filter(x => x.due === k).sort(sortTasks);
    return `<section class="day glass ${k === t ? 'today' : ''}">
      <div class="dh"><span class="wd">${esc(fmtWeekday(d))}</span><span class="dn num">${d.getDate()}</span></div>
      ${de.map(e => { const kk = KINDS.find(x => x.k === e.kind) || KINDS[0];
        if (e.allDay) return `<button class="ev allday" data-act="open-event" data-id="${esc(e.id)}" style="--cc:var(--c-${e.g ? 'gray' : kk.c})"><span class="tt">${esc(e.title)}${e.g ? '<span class="gb">G</span>' : ''}</span></button>`;
        return `<button class="ev" data-act="open-event" data-id="${esc(e.id)}" style="--cc:var(--c-${kk.c})"><span class="tt">${esc(e.title)}${e.g ? '<span class="gb" title="Google Agenda">G</span>' : ''}</span><span class="hh num">${esc(e.start||'')}${e.end ? '–' + esc(e.end) : ''} · ${esc(kk.n)}</span></button>`; }).join('')}
      ${dt.map(x => `<div class="due-t"><button class="check ${x.status === 'done' ? 'on' : ''}" data-act="toggle-done" data-id="${x.id}" aria-label="Concluir ${esc(x.title)}">${ic('check')}</button><button class="tx" data-act="open-task" data-id="${x.id}" style="${x.status === 'done' ? 'text-decoration:line-through;color:var(--fg-3)' : ''}">${esc(x.title)}</button></div>`).join('')}
      <button class="add" data-act="new-event" data-date="${k}">${ic('plus')}Adicionar</button>
    </section>`;
  }).join('')}</div>`;
}

}

/* ---------- reports ---------- */
function vReports() {
  const tasks = list('tasks'), done = tasks.filter(x => x.status === 'done');
  const groups = {};
  done.forEach(x => { const k = x.projectId && S.projects[x.projectId] ? x.projectId : '_none'; groups[k] = (groups[k] || 0) + 1; });
  const rows = Object.entries(groups).map(([k,n]) => ({ k, n, name: k === '_none' ? 'Sem projeto' : S.projects[k].name, color: k === '_none' ? 'gray' : S.projects[k].color })).sort((a,b) => b.n - a.n);
  const tot = done.length;
  const ws = weekStart();
  const weeks = [...Array(8)].map((_,i) => addDays(ws, (i-7)*7));
  const focusW = weeks.map(w => list('focus').filter(f => sameWeek(f.date, w)).reduce((s,f) => s + f.minutes, 0));
  const doneW = weeks.map(w => done.filter(x => x.doneAt && sameWeek(ymd(new Date(x.doneAt)), w)).length);
  const focusTot = list('focus').reduce((s,f) => s + f.minutes, 0);
  const avg = focusW.reduce((a,b) => a+b, 0) / 8;

  let donut = '';
  if (tot) {
    const C = 2*Math.PI*42; let acc = 0;
    donut = `<svg viewBox="0 0 120 120" width="168" height="168">${'<circle cx="60" cy="60" r="42" fill="none" stroke="var(--track)" stroke-width="14"/>'}${rows.map(r => {
      const len = C * r.n / tot, gap = rows.length > 1 ? Math.min(3, len*.3) : 0;
      const s = `<circle cx="60" cy="60" r="42" fill="none" stroke="var(--c-${r.color})" stroke-width="14" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;
      acc += len; return s;
    }).join('')}</svg>`;
  }
  return `
  <div class="page-head"><div><h1>Relatórios</h1><p>Para onde foi o trabalho e quanto tempo de foco você teve</p></div></div>
  <div class="rep-grid">
    <section class="card glass" style="grid-column:span 6">
      <div class="card-h"><div><h2>Por projeto</h2><div class="sub">Tarefas concluídas, desde o início</div></div></div>
      ${tot ? `<div class="donut-wrap"><div class="donut">${donut}<div class="c"><div><b class="num">${tot}</b><span>concluídas</span></div></div></div>
        <ul class="plegend">${rows.map(r => `<li style="--cc:var(--c-${r.color})"><span class="d"></span><span class="n">${esc(r.name)}</span><span class="num">${r.n}</span><span class="p num">${Math.round(r.n/tot*100)}%</span></li>`).join('')}</ul></div>`
        : `<div class="empty"><span><strong>Sem conclusões ainda.</strong> Quando você concluir tarefas, este gráfico mostra a divisão por projeto.</span></div>`}
    </section>
    <section class="card glass" style="grid-column:span 6">
      <div class="card-h"><div><h2>Foco</h2><div class="sub">Horas por semana, últimas 8 semanas</div></div></div>
      <div class="big num">${fmtHours(focusTot)}<small>no total · média de ${fmtHours(avg)} por semana</small></div>
      ${barsHtml(weeks.map((w,i) => ({ v: focusW[i], fmt: fmtHours, lab: `${w.getDate()}/${w.getMonth()+1}`, now: i === 7 })))}
    </section>
    <section class="card glass" style="grid-column:span 12">
      <div class="card-h"><div><h2>Ritmo de entregas</h2><div class="sub">Tarefas concluídas por semana</div></div><span class="num" style="color:var(--fg-2)">${doneW.reduce((a,b)=>a+b,0)} em 8 semanas</span></div>
      ${barsHtml(weeks.map((w,i) => ({ v: doneW[i], lab: `${w.getDate()}/${w.getMonth()+1}`, now: i === 7 })))}
    </section>
  </div>`;
}

function stepper(label, k, v, unit, step, min, max) {
  return `<div class="step"><span class="k">${esc(label)}</span><div class="row">
    <button data-act="step" data-k="${k}" data-d="${-step}" data-min="${min}" data-max="${max}" aria-label="Diminuir ${esc(label)}">${ic('minus')}</button>
    <span class="v num">${unit === 'auto' ? '–' : v}<small> ${unit}</small></span>
    <button data-act="step" data-k="${k}" data-d="${step}" data-min="${min}" data-max="${max}" aria-label="Aumentar ${esc(label)}">${ic('plus')}</button></div></div>`;
}

    ? `<footer><span class="sp"></span>${d.meet ? `<a class="btn" href="${esc(d.meet)}" target="_blank" rel="noopener">${ic('play')}Entrar na chamada</a>` : ''}${d.link ? `<a class="btn primary" href="${esc(d.link)}" target="_blank" rel="noopener">Abrir no Google Agenda</a>` : `<button class="btn" data-act="modal-close">Fechar</button>`}</footer>`
    : `<footer>${!isNew && !ui.confirmDel ? `<button class="btn sm danger" data-act="del-ask">${ic('trash')}Excluir</button>` : ''}<span class="sp"></span>
      <button class="btn" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="modal-save" ${ui.saving ? 'disabled' : ''}>${ui.saving ? 'Criando no Google…' : isNew ? 'Criar' : 'Salvar'}</button></footer>`;
  root.innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">${body}
    ${ui.modalErr ? `<div class="modal-err" role="alert">${esc(ui.modalErr)}</div>` : ''}
    ${ui.confirmDel ? `<div class="confirm"><span style="flex:1;min-width:160px">${delMsg}</span><button class="btn sm" data-act="del-cancel">Cancelar</button><button class="btn sm danger solid" data-act="del-confirm">Excluir</button></div>` : ''}
    ${footer}
  </div></div>`;
  const f = first ? $('#m-title') : (keepId && document.getElementById(keepId));
  if (f) f.focus();
}
function saveModal() {
  const d = ui.draft;
  if (ui.modal === 'task') {
    const title = d.title.trim();
    if (!title) { const el = $('#m-title'); el.focus(); el.placeholder = 'Dê um título para a tarefa'; return; }
    const prev = S.tasks[d.id];
    const obj = { id:d.id, title, projectId:d.projectId || '', priority:d.priority || 'none', status:d.status, due:d.due || '', subtasks:d.subtasks, notes:d.notes || '', createdAt:d.createdAt || Date.now(),
      doneAt: d.status === 'done' ? (prev && prev.status === 'done' ? prev.doneAt : Date.now()) : 0 };
    Store.put('tasks', obj);
    toast(prev ? 'Tarefa salva' : `Criada: ${title}`);
  } else if (ui.modal === 'event') {
    const title = d.title.trim();
    if (!title) { const el = $('#m-title'); el.focus(); el.placeholder = 'Dê um título para o compromisso'; return; }
    if (!d.date) { $('#m-date').focus(); return; }
    if (!d._exists && d.toGoogle && gOn()) { if (!ui.saving) gcalCreate(d, title); return; }
    let end = d.end; if (end && d.start && end < d.start) end = d.start;
    Store.put('events', { id:d.id, title, date:d.date, start:d.start || '', end:end || '', kind:d.kind, notes:d.notes || '', createdAt:d.createdAt || Date.now() });
    toast(d._exists ? 'Compromisso salvo' : `Marcado: ${title}`);
  } else if (ui.modal === 'project') {
    const name = d.name.trim();
    if (!name) { const el = $('#m-title'); el.focus(); el.placeholder = 'Dê um nome ao projeto'; return; }
    Store.put('projects', { id:d.id, name, color:d.color, createdAt:d.createdAt || Date.now() });
    toast(d._exists ? 'Projeto salvo' : `Projeto criado: ${name}`);
  }
  closeModal(); render();
}
function deleteModal() {
  const d = ui.draft;
  if (ui.modal === 'task') { const snap = { ...S.tasks[d.id] }; Store.del('tasks', d.id); toast('Tarefa excluída', { action: () => Store.put('tasks', snap) }); }
  else if (ui.modal === 'event') { const snap = { ...S.events[d.id] }; Store.del('events', d.id); toast('Compromisso excluído', { action: () => Store.put('events', snap) }); }
  else if (ui.modal === 'project') {
    list('tasks').filter(x => x.projectId === d.id).forEach(x => Store.put('tasks', { ...x, projectId:'' }));
    Store.del('projects', d.id);
    if (ui.fProject === d.id) ui.fProject = 'all';
    toast('Projeto excluído');
  }
  closeModal(); render();
}
function newTask(o={}) {
  openModal('task', { id: uid(), title:'', projectId: o.projectId || (ui.view === 'tarefas' && !['all','none'].includes(ui.fProject) ? ui.fProject : ''), priority:'none', status: o.status || 'todo', due: o.due || '', subtasks: [], notes:'' });
}
function editTask(id) { const x = S.tasks[id]; if (x) openModal('task', { ...x, subtasks: (x.subtasks || []).map(s => ({ ...s })), _exists: true }); }
function newEvent(date) {
  const now = new Date(), h = Math.min(22, now.getHours() + 1);
  openModal('event', { id: uid(), title:'', date: date || today(), start: `${pad(h)}:00`, end: `${pad(h)}:30`, kind:'meeting', notes:'',
    toGoogle: gOn() && !gIsErr(G.state), gcal: (S.settings.gcalCals || [])[0] || 'primary' });
}

/* ================= actions ================= */
function toggleDone(id) {
  const x = S.tasks[id]; if (!x) return;
  const prev = { ...x };
  if (x.status === 'done') { Store.put('tasks', { ...x, status: x.prevStatus && x.prevStatus !== 'done' ? x.prevStatus : 'todo', doneAt: 0 }); toast(`Reaberta: ${x.title}`, { kind:'info' }); }
  else { Store.put('tasks', { ...x, status:'done', prevStatus:x.status, doneAt:Date.now() }); toast(`Feita: ${x.title}`, { action: () => Store.put('tasks', prev) }); }
  render();
}
function moveTask(id, status) {
  const x = S.tasks[id]; if (!x || x.status === status) return;
  const prev = { ...x };
  Store.put('tasks', { ...x, status, prevStatus: x.status, doneAt: status === 'done' ? Date.now() : 0 });
  const s = STATUSES.find(z => z.k === status);
  toast(status === 'done' ? `Feita: ${x.title}` : `${x.title} → ${s.n}`, { action: () => Store.put('tasks', prev) });
  render();
}
function go(view) {
  if (!VIEWS.includes(view)) view = 'home';
  ui.view = view; ui.confirmWipe = false;
  try { history.replaceState(null, '', '#' + view); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
}
async function exportData() {
  const data = JSON.stringify({ app:'painel-rotina', version:1, exportedAt:new Date().toISOString(), tasks:S.tasks, projects:S.projects, events:S.events, focus:S.focus, settings:S.settings }, null, 2);
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) { toast('Exportar não está disponível nesta visualização. Abra o painel no claude.ai.', { kind:'warn', ms:6000 }); return; }
  try { await dl.save({ filename: `painel-rotina-${today()}.json`, data }); toast('Backup salvo'); }
  catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o backup agora. Tente de novo em instantes.', { kind:'warn' }); }
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'painel-rotina') throw new Error('formato');
    let n = 0;
    for (const c of COLS) for (const [id, obj] of Object.entries(d[c] || {})) { await Store.put(c, { ...obj, id }); n++; }
    if (d.settings) { S.settings = { ...DEFAULTS, ...d.settings }; applyLook(); Store.saveSettings(); gcalSync(); }
    toast(`Backup importado: ${n} itens`); render();
  } catch (e) { toast('Esse arquivo não é um backup do Painel de Rotina. Escolha o .json exportado aqui.', { kind:'warn', ms:6000 }); }
}
async function wipeAll() {
  ui.confirmWipe = false;
  for (const c of COLS) for (const id of Object.keys(S[c])) await Store.del(c, id);
  toast('Tudo apagado. Painel limpo.'); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'overlay') { if (e.target === el) closeModal(); return; }
  if (el.tagName === 'ARTICLE' && e.target.closest('button') && e.target.closest('button') !== el) return;
  switch (a) {
    case 'nav': go(el.dataset.view); break;
    case 'new-task': newTask({ status: el.dataset.status, due: el.dataset.due }); break;
    case 'open-task': editTask(id); break;
    case 'toggle-done': e.stopPropagation(); toggleDone(id); break;
    case 'mode': ui.mode = el.dataset.mode; try { localStorage.setItem('painel-rotina.mode', ui.mode); } catch (er) {} render(); break;
    case 'new-event': newEvent(el.dataset.date); break;
    case 'open-event': { const x = findEvent(id); if (x) openModal(x.g ? 'gevent' : 'event', { ...x, _exists: true }); break; }
    case 'week': { const d = +el.dataset.d; ui.weekOffset = d === 0 ? 0 : ui.weekOffset + d; gcalSync(); render(); break; }
    case 'gcal-connect': gcalConnect(); break;
    case 'gcal-off': S.settings = { ...S.settings, gcalOn: false }; Store.saveSettings(); G.data = {}; gcalSync(); toast('Google Agenda desligado do painel'); render(); break;
    case 'gcal-refresh': if (G.mcp) G.mcp.invalidate(GC, 'list_events').catch(() => {}); toast('Atualizando a agenda…', { kind:'info' }); break;
    case 'gcal-cal': { const a = new Set(S.settings.gcalCals || []); a.has(id) ? a.delete(id) : a.add(id); S.settings = { ...S.settings, gcalCals: [...a] }; Store.saveSettings(); gcalSync(); render(); break; }
    case 'draft-bool': ui.draft[el.dataset.k] = !ui.draft[el.dataset.k]; renderModal(); break;
    case 'new-project': openModal('project', { id: uid(), name:'', color: COLORS[list('projects').length % COLORS.length] }); break;
    case 'edit-project': { const p = S.projects[id]; if (p) openModal('project', { ...p, _exists: true }); break; }
    case 'focus-start': focusStart(); break;
    case 'focus-pause': focusPause(); break;
    case 'focus-resume': focusResume(); break;
    case 'focus-end': focusEnd(); break;
    case 'focus-mode': if (T.state === 'idle') { T.mode = el.dataset.mode; saveTimer(); render(); } break;
    case 'focus-quick': T.state === 'running' ? focusPause() : T.state === 'paused' ? focusResume() : focusStart(); break;
    case 'search': go('tarefas'); setTimeout(() => $('#fq')?.focus(), 0); break;
    case 'theme': {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      const nx = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nx); setSetting('theme', nx); break;
    }
    case 'set': {
      let v = el.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false;
      if (el.dataset.k === 'theme' && !v) document.documentElement.removeAttribute('data-theme');
      setSetting(el.dataset.k, v); break;
    }
    case 'step': { const k = el.dataset.k; const v = Math.max(+el.dataset.min, Math.min(+el.dataset.max, (+S.settings[k] || 0) + +el.dataset.d)); setSetting(k, v); break; }
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': ui.confirmWipe = true; render(); break;
    case 'wipe-cancel': ui.confirmWipe = false; render(); break;
    case 'wipe-confirm': wipeAll(); break;
    case 'toast-action': { const fn = toastState && toastState.action; toastState = null; clearTimeout(toastTimer); if (fn) fn(); render(); break; }
    case 'modal-close': closeModal(); break;
    case 'modal-save': saveModal(); break;
    case 'del-ask': ui.confirmDel = true; renderModal(); break;
    case 'del-cancel': ui.confirmDel = false; renderModal(); break;
    case 'del-confirm': deleteModal(); break;
    case 'draft': ui.draft[el.dataset.k] = el.dataset.v; renderModal(); break;
    case 'sub-add': addSub(); break;
    case 'sub-toggle': { const s = ui.draft.subtasks[+el.dataset.i]; s.d = !s.d; renderModal(); break; }
    case 'sub-del': ui.draft.subtasks.splice(+el.dataset.i, 1); renderModal(); break;
  }
});
function addSub() {
  const inp = $('#m-sub'); const t = inp && inp.value.trim(); if (!t) return;
  ui.draft.subtasks.push({ t, d: false }); renderModal(); const n = $('#m-sub'); if (n) { n.value = ''; n.focus(); }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && ui.draft) { ui.draft[el.dataset.bind] = el.value; return; }
  if (el.id === 'fq') { ui.q = el.value; $('#taskArea').innerHTML = taskArea(); return; }
  if (el.dataset.set) { S.settings = { ...S.settings, [el.dataset.set]: el.value }; Store.saveSettings(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind && ui.draft) { ui.draft[el.dataset.bind] = el.value; return; }
  if (el.id === 'fProject') { ui.fProject = el.value; $('#taskArea').innerHTML = taskArea(); }
  if (el.id === 'fPrio') { ui.fPrio = el.value; $('#taskArea').innerHTML = taskArea(); }
  if (el.id === 'importFile' && el.files[0]) { importData(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (ui.modal) {
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.target.id === 'm-sub' && e.key === 'Enter') { e.preventDefault(); addSub(); return; }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || (e.target.tagName === 'INPUT' && e.target.id !== 'm-sub'))) { e.preventDefault(); saveModal(); }
    return;
  }
  if (e.key === 'Enter' && e.target.matches('[data-act="open-task"],[data-act="open-event"]')) { e.target.click(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newTask(); }
  else if (e.key === '/') { e.preventDefault(); go('tarefas'); setTimeout(() => $('#fq')?.focus(), 0); }
  else if (e.key === 'f' || e.key === 'F') { T.state === 'running' ? focusPause() : T.state === 'paused' ? focusResume() : focusStart(); }
  else if (/^[1-6]$/.test(e.key)) go(VIEWS[+e.key - 1]);
});

/* drag & drop on the board */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.tcard'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (er) {} });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.tcard'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col-b.over').forEach(x => x.classList.remove('over')); dragId = null; });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col-b.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop]'); if (!col || !dragId) return; e.preventDefault(); col.classList.remove('over'); moveTask(dragId, col.dataset.drop); });

/* ================= boot ================= */
try { const m = localStorage.getItem('painel-rotina.mode'); if (m === 'list' || m === 'board') ui.mode = m; } catch (e) {}
const h = (location.hash || '').slice(1); if (VIEWS.includes(h)) ui.view = h;
applyLook(); render(); renderIsland();
Store.init();
setInterval(() => { if (!ui.modal && ui.view === 'home' && !document.activeElement?.closest?.('#view')) render(); }, 60000);
})();
</script>
